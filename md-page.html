                const titleMatch = metadataText.match(/title\s*=\s*([^\n]+)/i);
                if (titleMatch) {
                    metadata.title = titleMatch[1].trim();
                }
                
                // 解析 author
                const authorMatch = metadataText.match(/author\s*=\s*([^\n]+)/i);
                if (authorMatch) {
                    metadata.author = authorMatch[1].trim();
                }
                
                // 解析 description
                const descMatch = metadataText.match(/description\s*=\s*([^\n]+)/i);
                if (descMatch) {
                    metadata.description = descMatch[1].trim();
                }
            }
            
            return metadata;
        }
        
        // 生成目录
        function generateTOC() {
            const headers = preview.querySelectorAll('h1, h2, h3, h4, h5, h6');
            
            if (headers.length === 0) {
                toc.innerHTML = '<p style="color: var(--text-secondary); text-align: center; margin: 1rem 0;">暂无目录</p>';
                return;
            }
            
            // 非递归方式生成目录结构
            let tocHtml = '<ul>';
            let currentLevel = 1;
            
            headers.forEach((header, index) => {
                const headerLevel = parseInt(header.tagName.charAt(1));
                const id = header.id;
                const text = header.textContent.trim();
                
                if (headerLevel > currentLevel) {
                    // 进入更深层级
                    for (let i = currentLevel; i < headerLevel; i++) {
                        tocHtml += '<ul>';
                    }
                } else if (headerLevel < currentLevel) {
                    // 回到更高层级
                    for (let i = currentLevel; i > headerLevel; i--) {
                        tocHtml += '</li></ul>';
                    }
                    tocHtml += '</li>';
                } else if (index > 0) {
                    // 同级别的下一个标题
                    tocHtml += '</li>';
                }
                
                // 添加当前标题
                tocHtml += `<li><a href="#${id}">${text}</a>`;
                
                currentLevel = headerLevel;
            });
            
            // 关闭所有未关闭的标签
            for (let i = 1; i <= currentLevel; i++) {
                tocHtml += '</li></ul>';
            }
            
            toc.innerHTML = tocHtml;
        }
        
        // 渲染 Markdown
        function renderMarkdown(text) {
            // 解析元数据
            const metadata = parseMarkdownMetadata(text);
            
            // 更新页面标题和描述
            if (metadata.title) {
                pageTitle.textContent = metadata.title;
                document.title = metadata.title;
            }
            
            if (metadata.description) {
                pageDescription.textContent = metadata.description;
            }
            
            // 渲染 Markdown 内容
            const html = marked.parse(text);
            preview.innerHTML = html;
            
            // 生成目录
            generateTOC();
        }
        
        // 显示页面错误
        function showPageError() {
            preview.innerHTML = `
                <div style="text-align: center; padding: 50px; color: #e74c3c;">
                    <h2 style="font-size: 2rem; margin-bottom: 20px;">页面错误</h2>
                    <p style="font-size: 1.2rem;">请在上方选择你想看的文章或者回到<a href = "/"首页>首页</a></p>
                    <!-- <p style="font-size: 1.2rem;">或者回到首页选择</p>1212 -->
                    <code style="display: inline-block; padding: 10px; background-color: #f8f8f8; border-radius: 4px; margin: 10px 0; font-size: 1rem;">
                        https://ycc77.cn/?file=getting-started.md
                    </code>

                </div>
            `;
        }
        
        // 加载指定的 Markdown 文件
        function loadMarkdownFile(filePath) {
            // 处理文件路径，确保正确
            let fullPath;
            
            // GitHub Pages配置1：根目录是仓库根目录，md文件在docs目录下
            const pathOption1 = `/docs/${filePath}`;
            // GitHub Pages配置2：根目录是docs目录，md文件在根目录下
            const pathOption2 = `/${filePath}`;
            
            // 首先尝试配置1
            fullPath = pathOption1;
            
            // 编码URL，确保中文文件名能正确处理
            fullPath = encodeURI(fullPath);
            
            fetch(fullPath)
                .then(response => {
                    if (!response.ok) {
                        // 配置1失败，尝试配置2
                        return fetch(pathOption2);
                    }
                    return response;
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok for both paths');
                    }
                    return response.text();
                })
                .then(text => {
                    renderMarkdown(text);
                })
                .catch(error => {
                    console.error('Error loading Markdown file:', error);
                    preview.innerHTML = `
                        <div style="text-align: center; padding: 50px; color: #e74c3c;">
                            <h2 style="font-size: 2rem; margin-bottom: 20px;">文章加载失败</h2>
                            <p style="color: #666;">请检查文件路径是否正确</p>
                            <p style="color: #666;">尝试的路径1：${encodeURI(pathOption1)}</p>
                            <p style="color: #666;">尝试的路径2：${encodeURI(pathOption2)}</p>
                        </div>
                    `;
                });
        }
        
        // 设置文件选择和跳转功能
        function setupFileSelector() {
            const fileSelect = document.getElementById('file-select');
            const goBtn = document.getElementById('go-btn');
            
            // 跳转按钮点击事件
            goBtn.addEventListener('click', () => {
                const selectedFile = fileSelect.value;
                if (selectedFile) {
                    window.location.href = `?file=${encodeURIComponent(selectedFile)}`;
                }
            });
            
            // 选择框change事件
            fileSelect.addEventListener('change', () => {
                const selectedFile = fileSelect.value;
                if (selectedFile) {
                    window.location.href = `?file=${encodeURIComponent(selectedFile)}`;
                }
            });
        }
        
        // 悬浮按钮功能
        function setupFloatingButtons() {
            // 返回顶部按钮
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
            
            // 返回首页按钮
            backToHomeBtn.addEventListener('click', () => {
                window.location.href = 'https://ycc77.cn';
            });
            
            // 滚动时显示/隐藏返回顶部按钮
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    backToTopBtn.style.opacity = '1';
                    backToTopBtn.style.pointerEvents = 'auto';
                } else {
                    backToTopBtn.style.opacity = '0';
                    backToTopBtn.style.pointerEvents = 'none';
                }
            });
            
            // 初始隐藏返回顶部按钮
            backToTopBtn.style.opacity = '0';
            backToTopBtn.style.pointerEvents = 'none';
        }
        
        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            // 设置悬浮按钮
            setupFloatingButtons();
            
            // 设置文件选择器
            setupFileSelector();
            
            const params = getQueryParams();
            if (params.file) {
                // URL中指定了文件，加载该文件
                loadMarkdownFile(params.file);
                
                // 自动选中对应的文件
                setTimeout(() => {
                    const fileSelect = document.getElementById('file-select');
                    // 确保选中的文件不包含docs/前缀
                    const fileName = params.file.replace('docs/', '');
                    fileSelect.value = fileName;
                }, 100);
            } else {
                // 没有指定文件，显示默认的md文件
                // 可以根据实际情况修改默认文件
                loadMarkdownFile('1-xianyu_bushu.md');
                // 自动选中对应的文件
                setTimeout(() => {
                    const fileSelect = document.getElementById('file-select');
                    fileSelect.value = '1-xianyu_bushu.md';
                }, 100);
            }
        });
    </script>
</body>
