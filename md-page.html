<body>
    <div class="container">

        <div class="preview" id="preview"></div>
    </div>
    
    <script>
        // 获取 DOM 元素
        const preview = document.getElementById('preview');
        
        // 初始化 marked 配置
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false
        });
        
        // 解析 URL 查询参数
        function getQueryParams() {
            const params = {};
            const queryString = window.location.search.substring(1);
            const pairs = queryString.split('&');
            pairs.forEach(pair => {
                const [key, value] = pair.split('=');
                params[decodeURIComponent(key)] = decodeURIComponent(value || '');
            });
            return params;
        }
        
        // 渲染 Markdown
        function renderMarkdown(text) {
            const html = marked.parse(text);
            preview.innerHTML = html;
        }
        
        // 显示页面错误
        function showPageError() {
            preview.innerHTML = `
                <div style="text-align: center; padding: 50px; color: #e74c3c;">
                    <h2 style="font-size: 2rem; margin-bottom: 20px;">页面错误</h2>
                    <p style="font-size: 1.2rem;">请在URL中指定要加载的文章，例如：</p>
                    <code style="display: inline-block; padding: 10px; background-color: #f8f8f8; border-radius: 4px; margin: 10px 0; font-size: 1rem;">
                        https://ycc77.cn/?file=getting-started.md
                    </code>

                </div>
            `;
        }
        
        // 加载指定的 Markdown 文件
        function loadMarkdownFile(filePath) {
            // 如果文件路径没有 docs/ 前缀，自动添加
            const fullPath = filePath.startsWith('docs/') ? filePath : `docs/${filePath}`;
            
            fetch(fullPath)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(text => {
                    renderMarkdown(text);
                })
                .catch(error => {
                    console.error('Error loading Markdown file:', error);
                    preview.innerHTML = `
                        <div style="text-align: center; padding: 50px; color: #e74c3c;">
                            <h2 style="font-size: 2rem; margin-bottom: 20px;">加载失败</h2>
                            <p style="font-size: 1.2rem;">无法加载文件 "${fullPath}"</p>
                            <p style="color: #666;">请检查文件名是否正确，支持的文件：</p>
                            <ul style="list-style: none; padding: 0; color: #666;">
                                <li>getting-started.md</li>
                                <li>api-reference.md</li>
                            </ul>
                        </div>
                    `;
                });
        }
        
        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            const params = getQueryParams();
            if (params.file) {
                // URL中指定了文件，加载该文件
                loadMarkdownFile(params.file);
            } else {
                // 没有指定文件，显示页面错误
                showPageError();
            }
        });
    </script>
