<body>
    <div class="container">
        <div class="main-content">
            <!-- MD内容区域 -->
            <div class="preview" id="preview"></div>
            
            <!-- 目录区域 -->
            <aside class="toc-container">
                <h3>文章目录</h3>
                <nav id="toc"></nav>
            </aside>
        </div>
    </div>
    
    <!-- 悬浮按钮 -->
    <div class="floating-buttons">
        <!-- 返回顶部按钮 -->
        <button id="back-to-top" class="floating-btn" title="返回顶部">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        </button>
        
        <!-- 返回首页按钮 -->
        <button id="back-to-home" class="floating-btn" title="返回首页">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </button>
    </div>
    
    <script>
        // 获取DOM元素
        const preview = document.getElementById('preview');
        const toc = document.getElementById('toc');
        const backToTopBtn = document.getElementById('back-to-top');
        const backToHomeBtn = document.getElementById('back-to-home');
        
        // 初始化marked配置
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false
        });
        
        // 解析URL查询参数
        function getQueryParams() {
            const params = {};
            const queryString = window.location.search.substring(1);
            const pairs = queryString.split('&');
            pairs.forEach(pair => {
                const [key, value] = pair.split('=');
                params[decodeURIComponent(key)] = decodeURIComponent(value || '');
            });
            return params;
        }
        
        // 生成目录
        function generateTOC() {
            const headers = preview.querySelectorAll('h1, h2, h3, h4, h5, h6');
            
            if (headers.length === 0) {
                toc.innerHTML = '<p style="color: #666; text-align: center;">暂无目录</p>';
                return;
            }
            
            // 生成目录HTML
            let tocHtml = '<ul>';
            let currentLevel = 1;
            
            headers.forEach((header, index) => {
                const headerLevel = parseInt(header.tagName.charAt(1));
                const id = header.id;
                const text = header.textContent.trim();
                
                // 处理层级变化
                if (headerLevel > currentLevel) {
                    // 进入更深层级
                    for (let i = currentLevel; i < headerLevel; i++) {
                        tocHtml += '<ul>';
                    }
                } else if (headerLevel < currentLevel) {
                    // 回到更高层级
                    for (let i = currentLevel; i > headerLevel; i--) {
                        tocHtml += '</li></ul>';
                    }
                    tocHtml += '</li>';
                } else if (index > 0) {
                    // 同级别的下一个标题
                    tocHtml += '</li>';
                }
                
                // 添加当前标题
                tocHtml += `<li><a href="#${id}">${text}</a>`;
                
                currentLevel = headerLevel;
            });
            
            // 关闭所有未关闭的标签
            for (let i = 1; i <= currentLevel; i++) {
                tocHtml += '</li></ul>';
            }
            
            toc.innerHTML = tocHtml;
        }
        
        // 渲染Markdown
        function renderMarkdown(text) {
            // 解析Markdown为HTML
            const html = marked.parse(text);
            preview.innerHTML = html;
            
            // 生成目录
            generateTOC();
        }
        
        // 显示页面错误
        function showPageError() {
            preview.innerHTML = `
                <div class="error">
                    <h2>页面错误</h2>
                    <p>请在URL中指定要加载的文章，例如：</p>
                    <code>https://ycc77.cn/md-page.html?file=getting-started.md</code>
                </div>
            `;
            toc.innerHTML = '<p style="color: #666; text-align: center;">暂无目录</p>';
        }
        
        // 显示加载错误
        function showLoadError(filePath) {
            preview.innerHTML = `
                <div class="error">
                    <h2>文章加载失败</h2>
                    <p>无法加载文件：${filePath}</p>
                    <p>请检查文件路径是否正确</p>
                </div>
            `;
            toc.innerHTML = '<p style="color: #666; text-align: center;">暂无目录</p>';
        }
        
        // 加载指定的Markdown文件
        function loadMarkdownFile(filePath) {
            // 处理文件路径，确保正确
            const cleanFilePath = filePath.replace(/^.*\//, '');
            
            // 尝试两种可能的路径
            const path1 = `/docs/${cleanFilePath}`;
            const path2 = `/${cleanFilePath}`;
            
            fetch(encodeURI(path1))
                .then(response => {
                    if (!response.ok) {
                        // 尝试第二种路径
                        return fetch(encodeURI(path2));
                    }
                    return response;
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('File not found');
                    }
                    return response.text();
                })
                .then(text => {
                    renderMarkdown(text);
                })
                .catch(error => {
                    console.error('Error loading Markdown file:', error);
                    showLoadError(cleanFilePath);
                });
        }
        
        // 设置悬浮按钮功能
        function setupFloatingButtons() {
            // 返回顶部按钮
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
            
            // 返回首页按钮
            backToHomeBtn.addEventListener('click', () => {
                window.location.href = 'https://ycc77.cn';
            });
            
            // 滚动时显示/隐藏返回顶部按钮
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    backToTopBtn.style.opacity = '1';
                    backToTopBtn.style.pointerEvents = 'auto';
                } else {
                    backToTopBtn.style.opacity = '0';
                    backToTopBtn.style.pointerEvents = 'none';
                }
            });
            
            // 初始隐藏返回顶部按钮
            backToTopBtn.style.opacity = '0';
            backToTopBtn.style.pointerEvents = 'none';
        }
        
        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            // 设置悬浮按钮
            setupFloatingButtons();
            
            // 解析URL参数
            const params = getQueryParams();
            if (params.file) {
                // 加载指定的MD文件
                loadMarkdownFile(params.file);
            } else {
                // 显示页面错误
                showPageError();
            }
        });
    </script>
