<!DOCTYPE html>
<html lang="$lang$" class="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://pic1.imgdb.cn/item/68f1b8ccc5157e1a887a8c09.png" type="image/x-icon">
    <title>$title$</title>
    <script async="" src="https://01987425-44bc-77e0-a189-165a6b6e93b4.spst2.com/ustat.js"></script>
    <!-- 引入字体：Inter（现代无衬线字体，优雅大气） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- 代码高亮：Prism.js（比默认高亮更炫酷，支持更多主题） -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markdown.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script async="" src="https://01987425-44bc-77e0-a189-165a6b6e93b4.spst2.com/ustat.js"></script>
    <style>
        /* 全局变量：亮色/暗黑模式统一管理 */
        :root.light {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --accent-light: #3b82f6;
            --border: #e2e8f0;
            --code-bg: #f8fafc;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        :root.dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-sidebar: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --border: #334155;
            --code-bg: #1e293b;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* 全局重置 & 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        body {
            font-family: 'Inter', '思源黑体', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            overflow-x: hidden;
        }
        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        a:hover {
            color: var(--accent-light);
            text-decoration: underline;
        }

        /* 顶部导航栏：简洁大气 */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }
        .navbar-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent; /* 渐变文字：炫酷但不浮夸 */
        }
        .mode-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.5rem 1rem;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .mode-toggle:hover {
            background: var(--border);
        }

        /* 主体布局：大气的双栏结构 */
        .container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 0;
        }

        /* 侧边目录：悬浮+滚动高亮（炫酷核心） */
        .sidebar {
            width: 280px;
            padding: 1.5rem;
            background-color: var(--bg-sidebar);
            border-radius: 12px;
            margin: 0 2rem;
            position: sticky;
            top: 4rem;
            align-self: flex-start;
            height: calc(100vh - 8rem);
            overflow-y: auto;
            box-shadow: var(--shadow);
        }
        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .toc {
            list-style: none;
        }
        .toc li {
            margin: 0.8rem 0;
        }
        .toc a {
            color: var(--text-secondary);
            font-weight: 400;
            padding: 0.3rem 0;
            display: block;
            border-left: 2px solid transparent;
            padding-left: 0.5rem;
        }
        .toc a:hover {
            color: var(--accent);
            text-decoration: none;
        }
        .toc a.active {
            color: var(--accent);
            border-left: 2px solid var(--accent);
            font-weight: 500;
        }
        /* 自定义滚动条：细节拉满 */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background-color: var(--text-secondary);
            border-radius: 3px;
        }

        /* 主内容区：优雅排版 */
        .content {
            flex: 1;
            padding: 0 2rem 2rem;
            max-width: 800px;
        }
        .markdown-body {
            font-size: 1.05rem;
        }
        /* 标题样式：层级分明+精致下划线 */
        .markdown-body h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 2rem 0 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid var(--border);
        }
        .markdown-body h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 1.8rem 0 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--border);
        }
        .markdown-body h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 1.5rem 0 1rem;
        }
        .markdown-body p {
            margin: 1rem 0;
            color: var(--text-primary);
        }
        .markdown-body img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: var(--shadow);
            margin: 1.5rem 0;
            object-fit: cover;
            /* 图片加载动画：炫酷小细节 */
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* 代码块：炫酷高亮+圆角 */
        .markdown-body pre {
            background-color: var(--code-bg) !important;
            border-radius: 8px;
            padding: 1.2rem !important;
            margin: 1.5rem 0 !important;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }
        .markdown-body code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95rem;
        }
        /* 表格：优雅排版 */
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .markdown-body th, .markdown-body td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .markdown-body th {
            background-color: var(--bg-secondary);
            font-weight: 600;
        }

        /* 页脚：简洁收尾 */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        /* 响应式适配：移动端优雅折叠 */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                padding: 1rem;
            }
            .sidebar {
                width: 100%;
                margin: 0 0 1.5rem 0;
                height: auto;
                max-height: 300px;
            }
            .content {
                padding: 0;
            }
            .navbar {
                padding: 1rem;
            }
            .markdown-body h1 {
                font-size: 1.8rem;
            }
            .markdown-body h2 {
                font-size: 1.5rem;
            }
        }

        /* 平滑滚动：全局丝滑体验 */
        html {
            scroll-behavior: smooth;
        }
        /* 侧边目录样式补充（确保目录可见） */
.toc {
  list-style: none;
  padding-left: 0 !important; /* 移除默认缩进 */
}
.toc ul {
  list-style: none;
  padding-left: 1rem !important; /* 子目录缩进 */
  margin: 0.5rem 0 !important;
}
.toc li {
  margin: 0.5rem 0 !important;
}
.toc a {
  color: var(--text-secondary) !important; /* 强制显示文字颜色 */
  display: block !important;
}
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="navbar-title">$title$</div>

        <button class="mode-toggle" id="modeToggle">
            <span id="modeIcon">🌞</span>
            <span id="modeText">切换暗黑模式</span>
        </button>
    </nav>

    <!-- 主体内容 -->
    <div class="container">
        <!-- 侧边目录 -->
        <aside class="sidebar">
            <div class="sidebar-title">目录</div>
            <nav class="toc">
                $toc$
            </nav>
        </aside>

        <!-- 核心内容区 -->
        <main class="content markdown-body">
            $body$
        </main>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <p>生成时间：$date$ · 由 Pandoc + 优雅模板构建</p>
    </footer>

    <script>
        // 1. 暗黑/亮色模式切换（记忆用户选择）
        const html = document.documentElement;
        const modeToggle = document.getElementById('modeToggle');
        const modeIcon = document.getElementById('modeIcon');
        const modeText = document.getElementById('modeText');

        // 从本地存储读取模式
        const savedMode = localStorage.getItem('colorMode');
        if (savedMode === 'dark') {
            html.classList.remove('light');
            html.classList.add('dark');
            modeIcon.textContent = '🌙';
            modeText.textContent = '切换亮色模式';
        }

        // 切换逻辑
        modeToggle.addEventListener('click', () => {
            if (html.classList.contains('light')) {
                html.classList.remove('light');
                html.classList.add('dark');
                localStorage.setItem('colorMode', 'dark');
                modeIcon.textContent = '🌙';
                modeText.textContent = '切换亮色模式';
            } else {
                html.classList.add('light');
                html.classList.remove('dark');
                localStorage.setItem('colorMode', 'light');
                modeIcon.textContent = '🌞';
                modeText.textContent = '切换暗黑模式';
            }
        });

        // 2. 目录滚动高亮（炫酷交互核心）
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const id = entry.target.getAttribute('id');
                const link = document.querySelector(`.toc a[href="#${id}"]`);
                if (link) {
                    if (entry.isIntersecting) {
                        // 移除所有active
                        document.querySelectorAll('.toc a.active').forEach(el => {
                            el.classList.remove('active');
                        });
                        link.classList.add('active');
                    }
                }
            });
        }, { rootMargin: '-100px 0px -80% 0px' });

        // 监听所有标题
        document.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(heading => {
            observer.observe(heading);
        });

        // 3. 代码高亮初始化
        document.addEventListener('DOMContentLoaded', () => {
            Prism.highlightAll();
        });
    </script>
</body>
</html>
